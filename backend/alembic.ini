# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# Template for migration filenames
file_template = %%(rev)s_%%(slug)s

# Timezone for revision creation dates
timezone = UTC

# Database URL is read from the environment variable at runtime in env.py
# Do NOT set sqlalchemy.url here — it must come from the environment.
# sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format new migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
